<div class="login-container">
  <div class="login-card">
    <!-- Logo -->
    <div class="logo">
      <img
        src="assets/images/logo.png"
        alt="الغدية لتنمية القبيلة التقليدية - Tenmiye Logo"
      />
      <p class="logo-tagline">الغــــــدية</p>
      <p class="logo-subtitle">لتنمية القبيلة التقليدية</p>
    </div>

    <!-- Title -->
    <h1 class="title">Admin Dashboard</h1>
    <h2 class="subtitle">لوحة الإدارة</h2>

    <!-- Error Message -->
    @if (error$ | async; as error) {
    <div class="error-banner" role="alert">
      <span class="error-icon">⚠️</span>
      <span class="error-text">{{ error }}</span>
    </div>
    }

    <!-- Google Login Button -->
    <button
      class="google-login-btn"
      [disabled]="loading$ | async"
      (click)="onGoogleLogin()"
      aria-label="Sign in with Google"
    >
      @if (!(loading$ | async)) {
      <span class="btn-content">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            fill="#4285F4"
          />
          <path
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            fill="#34A853"
          />
          <path
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            fill="#FBBC05"
          />
          <path
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            fill="#EA4335"
          />
        </svg>
        <span>Sign in with Google</span>
      </span>
      } @else {
      <span class="spinner" aria-live="polite">
        <span class="spinner-icon"></span>
        <span>Signing in...</span>
      </span>
      }
    </button>

    <!-- Restricted Notice -->
    <p class="notice">
      Restricted to approved admins<br />
      <span class="notice-ar">محدود للمسؤولين المعتمدين فقط</span>
    </p>
  </div>
</div>
